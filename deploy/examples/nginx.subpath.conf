# Nginx front for Arcane served under /arcane — see compose.subpath.yaml.
#
# The prefix is deliberately NOT stripped. Arcane runs with BASE_PATH=/arcane
# and serves the UI, the API and the WebSocket endpoints under that prefix, so
# proxy_pass must forward the original request URI unchanged. Adding a URI part
# to proxy_pass (e.g. proxy_pass http://arcane:3552/;) would strip the prefix
# and break every asset and API call.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Container image uploads and project archives are large.
    client_max_body_size 0;

    # Arcane answers /arcane with a redirect to /arcane/, but the prefix
    # location below does not match the bare form.
    location = /arcane {
        return 308 /arcane/;
    }

    location /arcane/ {
        # No trailing URI on proxy_pass: forwards /arcane/... as-is.
        proxy_pass http://arcane:3552;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Set this to https when this server block terminates TLS. Arcane only
        # honors it from an address listed in TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Container logs, stats, terminals and the event stream are WebSockets.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Live streams are long-lived and must not be buffered or timed out.
        proxy_buffering  off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
